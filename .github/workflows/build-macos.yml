name: Build macOS app

# Builds the .app on a macOS runner (can't be done on Windows), packages a .dmg,
# uploads it as a workflow artifact, and — when run for a release/tag — attaches
# the .dmg (+ .sha256) to that GitHub Release so the cross-platform auto-updater
# can serve it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .dmg to (e.g. v6.2.0). Leave blank to only build an artifact."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    # Apple Silicon runner (macos-latest). Builds a native arm64 .app for
    # M1/M2/M3+ Macs — the actively-supported, readily-scheduled runner.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # On a manual run for a tag, build THAT tag's source — not the default
      # branch — so the .dmg attached to the release matches its version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify the release tag matches __version__
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('mico360/__init__.py').read()).group(1))")
          echo "Source version: $VER"
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$VER" ]; then
              echo "::error::Tag '$TAG' does not match v$VER from mico360/__init__.py"
              exit 1
            fi
            echo "Tag $TAG matches v$VER"
          else
            echo "No release tag given - artifact-only build."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # run_suite.py runs every suite (even after a failure), with a per-suite
      # timeout and a throw-away settings file, and exits non-zero if any fail.
      - name: Run the test suites on macOS
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/run_suite.py --timeout 900 \
            feature_audit cross_platform responsive_dpi single_instance \
            download_resume page_organizer low_resource spec_parity \
            ocr_images ocr_rerun ocr_quality docs_sync help_legal \
            selftest_mode options_layout bugfix_2026_09

      - name: Build the app icon (.icns)
        run: |
          python build/make_iconset.py
          iconutil -c icns build/MICO360.iconset -o mico360/resources/app.icns

      - name: Build the .app with PyInstaller
        run: |
          pyinstaller build/mico360_macos.spec --noconfirm --distpath dist --workpath build/_work
          test -d "dist/MICO360 Doc Toolkit.app" || (echo "::error::.app was not produced" && exit 1)

      # The same post-build self-test the Windows .exe passes: every bundled
      # library, every tool on sample files, OCR (PDFs, images, repeated runs),
      # and the whole UI — run inside the finished .app.
      - name: Self-test the built app (--selftest)
        run: |
          BIN="dist/MICO360 Doc Toolkit.app/Contents/MacOS/MICO360DocToolkit"
          mkdir -p dist/selftest
          set +e
          MICO360_SETTINGS_FILE="$RUNNER_TEMP/selftest.ini" QT_QPA_PLATFORM=offscreen \
            "$BIN" --selftest "$PWD/dist/selftest/macos-selftest.json"
          RC=$?
          set -e
          cat dist/selftest/macos-selftest.txt || echo "::error::no self-test report was written"
          if [ "$RC" -ne 0 ]; then echo "::error::the macOS app failed its self-test (exit $RC)"; exit 1; fi

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MICO360-macOS-selftest
          path: dist/selftest/

      - name: Smoke-test the bundle (it must launch)
        run: |
          BIN="dist/MICO360 Doc Toolkit.app/Contents/MacOS/MICO360DocToolkit"
          QT_QPA_PLATFORM=offscreen "$BIN" & PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then echo "launched OK"; kill $PID; else echo "::error::app exited early"; exit 1; fi

      - name: Package the .dmg (+ checksum)
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('mico360/__init__.py').read()).group(1))")
          echo "VER=$VER" >> "$GITHUB_ENV"
          STAGE=dist/dmg
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "dist/MICO360 Doc Toolkit.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # Name with a "macos-" segment, and give the checksum a .sha256.TXT
          # extension. This keeps the macOS checksum from being mistaken for the
          # Windows installer's by older Windows updaters (which grab "any
          # .sha256" on a release) — the toolkit's own updater accepts either
          # .sha256 or .sha256.txt. Order-independent and robust.
          hdiutil create -volname "MICO360 Doc Toolkit" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/MICO360-DocToolkit-macos-$VER.dmg"
          cp "dist/MICO360-DocToolkit-macos-$VER.dmg" "dist/MICO360-DocToolkit-macos-Latest.dmg"
          cd dist
          for f in "MICO360-DocToolkit-macos-$VER.dmg" "MICO360-DocToolkit-macos-Latest.dmg"; do
            shasum -a 256 "$f" | awk '{printf "%s  %s", $1, "'"$f"'"}' > "$f.sha256.txt"
          done
          ls -lh MICO360-DocToolkit-macos-*

      - name: Upload .dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MICO360-macOS-dmg
          path: |
            dist/MICO360-DocToolkit-macos-*.dmg
            dist/MICO360-DocToolkit-macos-*.dmg.sha256.txt

      - name: Attach .dmg to the release (release event or tag input)
        if: ${{ github.event_name == 'release' || github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}${{ github.event.inputs.tag }}"
          gh release upload "$TAG" \
            dist/MICO360-DocToolkit-macos-*.dmg dist/MICO360-DocToolkit-macos-*.dmg.sha256.txt \
            --clobber --repo "${{ github.repository }}"
